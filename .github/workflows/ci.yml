name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Docker Hub repository: <namespace>/<name>. Override the name with a repo
  # variable IMAGE_NAME; the namespace comes from the Docker Hub credentials.
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'climage' }}
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME || 'climage' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh tests/*.sh

  # Full history on every run, not just the PR's diff: the repository is
  # public, so a secret that was committed and later deleted is still exposed.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSLo "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan git history
        run: gitleaks git --redact --verbose --no-banner .

  # Four variants x two architectures. `base` publishes as `latest`; `slim`
  # drops the heavy apt groups; `full` adds the headless-browser libraries and
  # the Go and Rust toolchains on top of base; `full-argus` is `full` plus the
  # first-party argus tooling.
  # Every architecture builds and smoke-tests on its own native runner: QEMU
  # emulation of an arm64 apt layer costs tens of minutes, while a native arm
  # runner is free for public repositories.
  build-test:
    name: Build & smoke test (${{ matrix.variant }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [lint, secret-scan]
    strategy:
      fail-fast: false
      matrix:
        variant: [base, slim, full, full-argus]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - variant: slim
            build_args: |
              INSTALL_MEDIA=false
              INSTALL_BUILD_TOOLS=false
          - variant: full
            build_args: |
              INSTALL_BROWSER=true
              INSTALL_GO=true
              INSTALL_RUST=true
          - variant: full-argus
            build_args: |
              INSTALL_ARGUS=true
              INSTALL_BROWSER=true
              INSTALL_GO=true
              INSTALL_RUST=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (load into local daemon)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: climage:ci
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          # Scope the cache per variant and architecture: a shared scope would
          # have these four jobs overwriting each other's layers every run.
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      # The image records its own build flags, so this asserts exactly the tools
      # the variant is supposed to have — a slim build passes, a full build that
      # silently lost ffmpeg fails.
      - name: Smoke test
        run: docker run --rm -v "${PWD}/tests:/tests:ro" climage:ci bash /tests/smoke.sh

      - name: Report image size
        run: docker image inspect climage:ci --format '{{.Size}}' | numfmt --to=iec

  # Each variant/architecture is pushed by digest only (no tags). The manifest
  # job then assembles one multi-arch tag set per variant.
  publish:
    name: Push ${{ matrix.variant }}/${{ matrix.arch }} by digest
    runs-on: ${{ matrix.runner }}
    needs: build-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [base, slim, full, full-argus]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - variant: slim
            build_args: |
              INSTALL_MEDIA=false
              INSTALL_BUILD_TOOLS=false
          - variant: full
            build_args: |
              INSTALL_BROWSER=true
              INSTALL_GO=true
              INSTALL_RUST=true
          - variant: full-argus
            build_args: |
              INSTALL_ARGUS=true
              INSTALL_BROWSER=true
              INSTALL_GO=true
              INSTALL_RUST=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One manifest per variant. `latest` is the base build; `slim`, `full` and
  # `full-argus` get their own bare tags and suffixed release tags. There is
  # deliberately no `edge`: with `latest` already tracking main, it was a second
  # name for the same digest.
  manifest:
    name: Publish ${{ matrix.variant }} manifest
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            # latest=auto also moves `latest` onto a semver release tag.
            flavor: latest=auto
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
              type=sha,format=short
          - variant: slim
            # Must be false, or a release would point bare `latest` at the slim
            # image and clobber the base build.
            flavor: latest=false
            tags: |
              type=raw,value=slim,enable={{is_default_branch}}
              type=semver,pattern={{version}},suffix=-slim
              type=semver,pattern={{major}}.{{minor}},suffix=-slim
              type=semver,pattern={{major}},suffix=-slim,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
              type=sha,format=short,suffix=-slim
          - variant: full
            # Same reasoning as slim: never let this variant claim `latest`.
            flavor: latest=false
            tags: |
              type=raw,value=full,enable={{is_default_branch}}
              type=semver,pattern={{version}},suffix=-full
              type=semver,pattern={{major}}.{{minor}},suffix=-full
              type=semver,pattern={{major}},suffix=-full,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
              type=sha,format=short,suffix=-full
          - variant: full-argus
            flavor: latest=false
            tags: |
              type=raw,value=full-argus,enable={{is_default_branch}}
              type=semver,pattern={{version}},suffix=-full-argus
              type=semver,pattern={{major}}.{{minor}},suffix=-full-argus
              type=semver,pattern={{major}},suffix=-full-argus,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
              type=sha,format=short,suffix=-full-argus
    steps:
      # Exact names, not `digest-<variant>-*`: that glob for `full` also
      # matches `full-argus`, which would merge four images into one tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          name: digest-${{ matrix.variant }}-amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          name: digest-${{ matrix.variant }}-arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: ${{ matrix.flavor }}
          tags: ${{ matrix.tags }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect published image
        run: |
          tag=$(jq -cr '.tags[0]' <<<"${DOCKER_METADATA_OUTPUT_JSON}")
          docker buildx imagetools inspect "${tag}"
