# The highest minimum any pinned hook declares: end-of-file-fixer and
# trailing-whitespace at pre-commit-hooks v5.0.0 need 3.2.0. Re-check on every
# rev bump.
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # A system hook: it runs the hadolint on PATH, so `rev` picks only the hook
  # definition. Keep it at the Dockerfile's HADOLINT_VERSION; see AGENTS.md.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: [--config, .hadolint.yaml, --failure-threshold, warning]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
